name: test-pipeline
on:
  push:
    branches: [master]
  pull_request: 
    branches: [master]

jobs: 
  build: 
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

  test:
    needs: build
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
          node-version: 18
          cache: 'npm'
  
    - name: Install dependencies
      run: npm ci

    - name: Install playwright
      run: npx playwright install --with-deps
    
    - name: Run Playwright
      run: npx playwright test 
      
    - uses: actions/upload-artifact@v4 
      if: always() 
      with: 
        name: report results
        path: playwright-report
        retention-days: 30
      
    
