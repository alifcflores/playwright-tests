name: test-pipeline
on:
  push:
    branches: [master]

jobs: 
  test: 
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm i

    - name: Install playwright
      run: npx playwright install
    
    - name: Run Playwright
      run: npx plawright test
    
